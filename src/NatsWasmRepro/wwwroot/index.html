<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>NatsWasmRepro</title>
    <base href="/" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">X</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Runs on the browser event loop. .NET WebAssembly shares this single thread,
        // so if .NET blocks or spins, this counter stops as well.
        setInterval(() => {
            const el = document.getElementById("heartbeat");
            if (el) { el.textContent = (parseInt(el.textContent) + 1).toString(); }
        }, 250);
    </script>
</body>

</html>
